# Voice Incubator firmware for the Home Assistant Voice Preview Edition: the
# satellites of the Voice Incubator app
# (https://github.com/OHF-Voice/app-voice-incubator). Its component is
# components/voice_incubator, which speaks PROTOCOL.md. Built through a wrapper
# that brings Wi-Fi: voice-pe.yaml (the install page's: improv, a name from its
# MAC) or voice-pe.local.yaml (from a checkout: secrets.yaml).
#
# voice_incubator runs wake word detection itself, on mixednet-executor: no
# model is compiled in, the app pushes one over the socket after connecting. It
# listens on the XMOS AEC channel (channel 1, gain 4) and buffers and streams the
# AGC channel (channel 0) for the call. The AEC channel is streamed too, with gain,
# so each call yields both captures; the app identifies the speaker from it. The
# stock voice_assistant and micro_wake_word components are intentionally absent.
#
# The LED ring follows the call through the app's events, in the identified
# speaker's color (see "LED ring" below). Between calls it blinks red while the
# app streams the microphone for someone listening live (its Test page), flashes
# while a timer rings, shows the time left on each running timer in its own
# color (the soonest on top), shows two red LEDs while muted, and otherwise the
# LED Ring light if it is on.
#
# Home Assistant sees the Mute switch and the LED Ring light, as with the stock
# firmware: muted (from there or with the slider on the side), the microphones
# give silence; the ring's color and brightness are the light's.
#
# When the app asks something back (an LLM's question, a command's
# confirmation), the microphone opens again for the answer once the reply has
# played, with no wake word, the ring spinning slowly (on_listen).
#
# The center button, pressed with nothing to stop or pause, starts a call (press
# to talk). "Stop", said alone, ends a response being said and stops a ringing
# timer, as in the stock firmware: the app keeps the model loaded, and it runs
# only then (listen_for_stop).
#
# Music: a Sendspin client (see "Music" below), so Music Assistant finds the
# device and plays to it; the app controls it through Music Assistant's player.
# Music is turned down -- never paused -- during a call and while a timer rings,
# and the center button pauses and resumes it (or stops a ringing timer). The
# dial sets the volume, the ring showing it, and the app's speech follows. With
# a speaker on the headphone jack, music keeps Sendspin's saved delay for it.
#
# The intercom (the app's "connect to the kitchen") streams the microphone to
# another satellite and plays it: wake words go unanswered, the ring blinks,
# and the center button ends it.
#
# Speech from a Home Assistant TTS entity (when the app is set to use one)
# arrives as a URL on the media player's announcement pipeline; the app hears
# when it starts and ends through voice_incubator.send_event.
#
# Night mode (the app's night event, from its area's switch in Home
# Assistant): light and sound kept to a minimum. The ring is dim and warm
# (ring_rgb, ring_brightness) and dark between calls, the LED Ring light
# aside; how a command went shows as the call ends -- one slow green pulse
# when it was done, two quick red blinks when it wasn't (the result event) --
# and the satellite's own sounds (mute, the jack) don't play. A ringing timer
# is as bright as ever. The app says nothing but answers, quietly.

substitutions:
  name: voice-incubator-vpe
  friendly_name: Voice Incubator VPE
  # The ring's displays take the LED Ring light's color (as 0xRRGGBB; a
  # recognized speaker's in a call) and its brightness, at least 20%, as the
  # stock firmware's do.
  # At night, but for a ringing timer: amber, at the least brightness.
  ring_rgb: "(id(night) && !id(timer_ringing) ? 0xFF4000 : int(id(led_ring).current_values.get_red() * 255) << 16 | int(id(led_ring).current_values.get_green() * 255) << 8 | int(id(led_ring).current_values.get_blue() * 255))"
  ring_brightness: "return id(night) && !id(timer_ringing) ? 0.2f : std::max(id(led_ring).current_values.get_brightness(), 0.2f);"
  # The speaker volume the media player's 0-100% maps to: the onboard amp
  # distorts above roughly 85%. The app's speech follows it (sync_call_volume).
  volume_min: "0.4"
  volume_max: "0.85"
  # A production VPE has 16 MB; early prototypes 8 MB (-s flash_size 8MB).
  flash_size: 16MB
  # The stock firmware's sounds, as of its 26.9.0 release.
  mute_switch_on_sound_file: https://github.com/esphome/home-assistant-voice-pe/raw/26.9.0/sounds/mute_switch_on.flac
  mute_switch_off_sound_file: https://github.com/esphome/home-assistant-voice-pe/raw/26.9.0/sounds/mute_switch_off.flac
  jack_connected_sound_file: https://github.com/esphome/home-assistant-voice-pe/raw/26.9.0/sounds/jack_connected.flac
  jack_disconnected_sound_file: https://github.com/esphome/home-assistant-voice-pe/raw/26.9.0/sounds/jack_disconnected.flac

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  on_boot:
    - priority: 375
      then:
        - script.execute: control_leds
        - delay: 1s
        - switch.turn_on: internal_speaker_amp
        # Still not connected to the app after 10 minutes: no longer starting
        # up, but lost (as the stock firmware).
        - delay: 10min
        - if:
            condition:
              lambda: return id(init_in_progress);
            then:
              - lambda: id(init_in_progress) = false;
              - script.execute: control_leds
    # After voice_incubator's own setup, which sets its configured volume.
    - priority: -100
      then:
        - script.execute: sync_call_volume

esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 240MHz
  variant: esp32s3
  flash_size: ${flash_size}
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

globals:
  # Wi-Fi being given over Bluetooth (the install page's improv): the ring
  # shows it, as the stock firmware does.
  - id: improv_ble_in_progress
    type: bool
    restore_value: no
    initial_value: 'false'
  # From boot until the app first connects (at most 10 minutes, as in the
  # stock firmware): the ring shows the device starting up, not a lost
  # connection.
  - id: init_in_progress
    type: bool
    restore_value: no
    initial_value: 'true'
  # Position of the spinning LEDs, shared so switching effects does not jump.
  - id: global_led_animation_index
    type: int
    restore_value: no
    initial_value: '0'
  # 0xRRGGBB of the speaker the app identified for the current call; -1 = none.
  - id: speaker_rgb
    type: int
    restore_value: no
    initial_value: '-1'
  # Music stays turned down while either is true (see "Music").
  - id: call_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: timer_ringing
    type: bool
    restore_value: no
    initial_value: 'false'
  # An announcement (Home Assistant TTS) is playing.
  - id: announcing
    type: bool
    restore_value: no
    initial_value: 'false'
  # The app is saying an announcement from another satellite.
  - id: app_announcing
    type: bool
    restore_value: no
    initial_value: 'false'
  # The dial was turned in the last second: the ring shows the volume -- the
  # Sendspin group's when that is what it turned (dial_group).
  - id: dial_touched
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: dial_group
    type: bool
    restore_value: no
    initial_value: 'false'
  # The effect a call's events last put on the ring, to go back to once the
  # dial's volume display is done.
  - id: call_effect
    type: std::string
    restore_value: no
    initial_value: '"Listening For Command"'
  # The timer that finishes soonest, from the app's timer_progress events: what
  # was left when the event came (counted down here since), of how long.
  - id: timer_shown
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: timer_left_s
    type: float
    restore_value: no
    initial_value: '0'
  - id: timer_total_s
    type: float
    restore_value: no
    initial_value: '1'
  - id: timer_paused
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: timer_received_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # Every running timer, soonest first (at most six): what each had left when
  # the event came, its color (0xRRGGBB; -1: the LED Ring light's), and the
  # longest one's length, which the whole ring stands for. An app from
  # before sends the soonest alone.
  - id: timer_count
    type: int
    restore_value: no
    initial_value: '0'
  - id: timer_scale_s
    type: float
    restore_value: no
    initial_value: '1'
  - id: timer_lefts
    type: 'std::array<float, 6>'
    restore_value: no
    initial_value: 'std::array<float, 6>{}'
  - id: timer_colors
    type: 'std::array<int, 6>'
    restore_value: no
    initial_value: 'std::array<int, 6>{}'
  # The center button paused the music; the next press resumes it.
  - id: music_paused_by_button
    type: bool
    restore_value: no
    initial_value: 'false'
  # The call's response is being said: "stop" ends it (listen_for_stop).
  - id: responding
    type: bool
    restore_value: no
    initial_value: 'false'
  # The headphone jack was plugged in or pulled out in the last second: the
  # ring sweeps up or down.
  - id: jack_plugged_recently
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: jack_unplugged_recently
    type: bool
    restore_value: no
    initial_value: 'false'
  # One of this satellite's own sounds is playing (play_sound): an
  # announcement the app is not told about.
  - id: playing_sound
    type: bool
    restore_value: no
    initial_value: 'false'
  # Night mode is on in the satellite's area (the app's night event).
  - id: night
    type: bool
    restore_value: no
    initial_value: 'false'
  # How the last command went (the app's result event, at night), shown on
  # the ring for a moment from result_started_ms (show_result).
  - id: showing_result
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: result_ok
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: result_started_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

switch:
  # The mute switch Home Assistant sees, as in the stock firmware: on while the
  # slider on the side is, or when turned on from Home Assistant (then only
  # while the slider is off, which overrides it). Muted, the microphones give
  # silence: no wake word is heard and the center button starts no call.
  - platform: template
    id: master_mute_switch
    name: Mute
    icon: "mdi:microphone-off"
    entity_category: config
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: return id(hardware_mute_switch).state || id(i2s_mics).get_mute_state();
    turn_on_action:
      - if:
          condition:
            binary_sensor.is_off: hardware_mute_switch
          then:
            - microphone.mute: i2s_mics
    turn_off_action:
      - if:
          condition:
            binary_sensor.is_off: hardware_mute_switch
          then:
            - microphone.unmute: i2s_mics
    on_turn_on:
      - script.execute: control_leds
    on_turn_off:
      - script.execute: control_leds
  - platform: gpio
    pin: GPIO47
    id: internal_speaker_amp
    restore_mode: ALWAYS_OFF
    internal: true

logger:

# The app is a satellite's client (its own protocol), so it doesn't need Home
# Assistant's ESPHome connection: without one, ESPHome's default rebooted it
# every 15 minutes.
api:
  reboot_timeout: 0s
  actions:
    - action: start_call
      then:
        - voice_incubator.start: manual

sensor:
  # The dial, as in the stock firmware: the volume of this satellite (its media
  # player, and with it the app's speech), or -- turned with the center button
  # held while music plays -- of the whole Sendspin group. The ring shows it
  # meanwhile.
  - platform: rotary_encoder
    id: dial
    internal: true
    pin_a: GPIO16
    pin_b: GPIO18
    resolution: 2
    on_clockwise:
      - lambda: id(dial_touched) = true;
      - if:
          condition:
            and:
              - binary_sensor.is_on: center_button
              - media_player.is_playing: sendspin_group_media_player
          then:
            - script.execute:
                id: control_group_volume
                increase_volume: true
          else:
            - script.execute:
                id: control_volume
                increase_volume: true
    on_anticlockwise:
      - lambda: id(dial_touched) = true;
      - if:
          condition:
            and:
              - binary_sensor.is_on: center_button
              - media_player.is_playing: sendspin_group_media_player
          then:
            - script.execute:
                id: control_group_volume
                increase_volume: false
          else:
            - script.execute:
                id: control_volume
                increase_volume: false

binary_sensor:
  # Physical mute slider on the side of the device: it cuts the microphones off
  # itself, and Home Assistant sees it as the Mute switch (the ring shows it).
  # The stock firmware's sounds say it -- going on, unless already muted from
  # Home Assistant -- and sliding it off unmutes that too, as there.
  - platform: gpio
    id: hardware_mute_switch
    internal: true
    pin: GPIO3
    on_press:
      - if:
          condition:
            switch.is_off: master_mute_switch
          then:
            - script.execute:
                id: play_sound
                sound_file: mute_switch_on_sound
    on_release:
      - script.execute:
          id: play_sound
          sound_file: mute_switch_off_sound
      - microphone.unmute: i2s_mics
  # The headphone jack, as in the stock firmware: with a speaker on it, music
  # keeps the delay Sendspin saved for it; the ring sweeps down as it goes in
  # and up as it comes out, with its sounds. Debounced: plugging it in can
  # flicker.
  - platform: gpio
    id: jack_plugged
    internal: true
    pin: GPIO17
    filters:
      - delayed_on: 200ms
      - delayed_off: 200ms
    on_press:
      - sendspin.media_source.enable_static_delay_adjustment:
      - lambda: id(jack_plugged_recently) = true;
      - script.execute: control_leds
      - delay: 200ms
      - script.execute:
          id: play_sound
          sound_file: jack_connected_sound
      - delay: 800ms
      - lambda: id(jack_plugged_recently) = false;
      - script.execute: control_leds
    on_release:
      - sendspin.media_source.disable_static_delay_adjustment:
      - lambda: id(jack_unplugged_recently) = true;
      - script.execute: control_leds
      - delay: 200ms
      - script.execute:
          id: play_sound
          sound_file: jack_disconnected_sound
      - delay: 800ms
      - lambda: id(jack_unplugged_recently) = false;
      - script.execute: control_leds
  # Center button: ends the intercom; else stops a ringing timer; else ends the
  # call. Otherwise it pauses the music when it is playing, and resumes it on
  # the next press (Music Assistant pauses the whole Sendspin group); with
  # neither, it starts a call, unless the microphones are muted. Held while the
  # dial turns, it is the group's volume instead (see "dial").
  - platform: gpio
    id: center_button
    internal: true
    pin:
      number: GPIO0
      inverted: true
    on_click:
      - max_length: 1s
        then:
          # Held to turn the group's volume with the dial: not a press.
          - if:
              condition:
                lambda: return !id(dial_touched);
              then:
              - if:
                  condition:
                    voice_incubator.is_intercom:
                  then:
                    # Ends it here at once, and the app ends it on the other.
                    - voice_incubator.end_intercom:
                    - script.execute: duck_music
                    - script.execute: control_leds
                  else:
                    - if:
                        condition:
                          lambda: return id(timer_ringing);
                        then:
                          # The app stops the alarm and the timer; quiet the ring and
                          # whatever is being announced here at once.
                          - voice_incubator.send_event: stop_timer
                          - lambda: id(timer_ringing) = false;
                          - script.execute: listen_for_stop
                          - if:
                              condition:
                                media_player.is_announcing: external_media_player
                              then:
                                - media_player.stop:
                                    id: external_media_player
                                    announcement: true
                          - script.execute: duck_music
                          - script.execute: control_leds
                        else:
                          - if:
                              condition:
                                voice_incubator.is_in_call:
                              then:
                                # Cancels the call and what it is saying: Piper's
                                # audio is cut off here, and a reply Home Assistant
                                # is announcing is stopped.
                                - voice_incubator.cancel:
                                - if:
                                    condition:
                                      media_player.is_announcing: external_media_player
                                    then:
                                      - media_player.stop:
                                          id: external_media_player
                                          announcement: true
                              else:
                                - if:
                                    condition:
                                      media_player.is_playing: sendspin_group_media_player
                                    then:
                                      - media_player.pause: sendspin_group_media_player
                                      - lambda: id(music_paused_by_button) = true;
                                    else:
                                      - if:
                                          condition:
                                            lambda: return id(music_paused_by_button);
                                          then:
                                            - media_player.play: sendspin_group_media_player
                                            - lambda: id(music_paused_by_button) = false;
                                          else:
                                            # Press to talk.
                                            - if:
                                                condition:
                                                  switch.is_off: master_mute_switch
                                                then:
                                                  - voice_incubator.start: manual

ota:
  - platform: esphome

# Its network comes from the wrapper that builds it.
wifi:
  id: wifi_id
  on_connect:
    - script.execute: control_leds
    # A speaker already on the jack at boot keeps its delay too.
    - if:
        condition:
          binary_sensor.is_on: jack_plugged
        then:
          - sendspin.media_source.enable_static_delay_adjustment:
        else:
          - sendspin.media_source.disable_static_delay_adjustment:
  on_disconnect:
    - script.execute: control_leds

external_components:
  - source:
      type: local
      path: components
    components: [voice_incubator]
  - source:
      type: git
      url: https://github.com/esphome/home-assistant-voice-pe
      ref: dev
    components: [voice_kit]
    refresh: 0s

# The app finds the device here and opens the control connection
# (PROTOCOL.md). Also under the name apps from before the rename browse for,
# until they are gone: the protocol is theirs too.
mdns:
  services:
    - service: "_voice-incubator"
      protocol: _tcp
      port: 6055
      txt:
        mac: !lambda 'return get_mac_address();'
        protocol: "2"
    - service: "_voice-labs"
      protocol: _tcp
      port: 6055
      txt:
        mac: !lambda 'return get_mac_address();'
        protocol: "2"

i2c:
  - id: internal_i2c
    sda: GPIO5
    scl: GPIO6
    frequency: 400kHz

voice_kit:
  id: voice_kit_component
  i2c_id: internal_i2c
  reset_pin: GPIO4
  # The XMOS exposes exactly two taps into its pipeline. Channel 0 stays on AGC
  # for the call; channel 1 moves from the stock NS to AEC, which is both what
  # the wake word models now run on and the second recording.
  channel_0_stage: AGC
  channel_1_stage: AEC
  firmware:
    url: https://github.com/esphome/voice-kit-xmos-firmware/releases/download/v1.3.1/ffva_v1.3.1_upgrade.bin
    version: "1.3.1"
    md5: 964635c5bf125529dab14a2472a15401

audio_dac:
  - platform: aic3204
    id: aic3204_dac
    i2c_id: internal_i2c

i2s_audio:
  - id: i2s_output
    i2s_lrclk_pin:
      number: GPIO7
    i2s_bclk_pin:
      number: GPIO8
  - id: i2s_input
    i2s_lrclk_pin:
      number: GPIO14
    i2s_bclk_pin:
      number: GPIO13

microphone:
  - platform: i2s_audio
    id: i2s_mics
    i2s_din_pin: GPIO15
    adc_type: external
    pdm: false
    sample_rate: 16000
    bits_per_sample: 32bit
    i2s_mode: secondary
    i2s_audio_id: i2s_input
    channel: stereo

speaker:
  - platform: i2s_audio
    id: i2s_audio_speaker
    sample_rate: 48000
    i2s_mode: secondary
    i2s_dout_pin: GPIO10
    bits_per_sample: 32bit
    i2s_audio_id: i2s_output
    dac_type: external
    channel: stereo
    timeout: never
    buffer_duration: 100ms
    audio_dac: aic3204_dac

  # The mixer converts mono to the stereo the I2S output expects; the resampler
  # only changes sample rate and bit depth, never the channel count.
  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_audio_speaker
    num_channels: 2
    task_stack_in_psram: true
    source_speakers:
      - id: call_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never
      - id: announcement_mixing_input
        timeout: never

  # voice_incubator speaks 16 kHz mono; the hardware wants 48 kHz.
  - platform: resampler
    id: call_speaker
    output_speaker: call_mixing_input
    sample_rate: 48000
    bits_per_sample: 16
  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 48000
    bits_per_sample: 16
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

# ---------------------------------------------------------------- Music
#
# As in the stock VPE firmware: Music Assistant connects to the Sendspin client
# (advertised as _sendspin._tcp) and plays through the media pipeline into the
# mixer. The client identifies itself by its MAC address, which is how the app
# finds this satellite's player in Music Assistant. sendspin_group_media_player
# plays nothing itself: it is a remote control for the Sendspin group, used by
# the center button.

sendspin:
  id: sendspin_hub
  task_stack_in_psram: false

media_source:
  - platform: sendspin
    id: sendspin_media_source
    fixed_delay: 480 microseconds  # the AIC3204 DAC, as configured, delays audio by 480 us
  # Home Assistant TTS: Home Assistant sends the URL, the device fetches it.
  - platform: audio_http
    id: http_announcement_source
    buffer_size: 250000
  # This satellite's own sounds (audio_file below), played as announcements.
  - platform: audio_file
    id: audio_file_announcement_source

audio_file:
  - id: mute_switch_on_sound
    file: ${mute_switch_on_sound_file}
  - id: mute_switch_off_sound
    file: ${mute_switch_off_sound_file}
  - id: jack_connected_sound
    file: ${jack_connected_sound_file}
  - id: jack_disconnected_sound
    file: ${jack_disconnected_sound_file}

media_player:
  - platform: sendspin
    id: sendspin_group_media_player
    on_play:
      - lambda: id(music_paused_by_button) = false;
  - platform: speaker_source
    id: external_media_player
    name: Media Player
    announcement_pipeline:
      format: FLAC
      num_channels: 1
      sample_rate: 48000
      speaker: announcement_resampling_speaker
      sources:
        - audio_file_announcement_source
        - http_announcement_source
    media_pipeline:
      format: FLAC
      num_channels: 2
      sample_rate: 48000
      speaker: media_resampling_speaker
      sources:
        - sendspin_media_source
    volume_increment: 0.05
    volume_min: ${volume_min}
    volume_max: ${volume_max}
    # However it changes -- the dial, Home Assistant, Music Assistant -- the
    # app's speech follows.
    on_volume:
      - script.execute: sync_call_volume
    on_mute:
      - script.execute: sync_call_volume
    on_unmute:
      - script.execute: sync_call_volume
    # The app hears when an announcement starts and ends -- not this
    # satellite's own sounds, which it did not ask for.
    on_announcement:
      - if:
          condition:
            lambda: return !id(playing_sound);
          then:
            - lambda: id(announcing) = true;
            - voice_incubator.send_event: announcing
      - script.execute: duck_music
    on_state:
      - if:
          condition:
            and:
              - lambda: return id(announcing);
              - not:
                  media_player.is_announcing: external_media_player
          then:
            - lambda: id(announcing) = false;
            - voice_incubator.send_event: announced
            - script.execute: duck_music
      - if:
          condition:
            and:
              - lambda: return id(playing_sound);
              - not:
                  media_player.is_announcing: external_media_player
          then:
            - lambda: id(playing_sound) = false;
            - script.execute: duck_music

script:
  # A step of the dial: this satellite's volume up or down, shown on the ring
  # for a second after the last step.
  - id: control_volume
    mode: restart
    parameters:
      increase_volume: bool
    then:
      - lambda: id(dial_group) = false;
      - delay: 16ms
      - if:
          condition:
            lambda: return increase_volume;
          then:
            - media_player.volume_up: external_media_player
          else:
            - media_player.volume_down: external_media_player
      - script.execute: control_leds
      - delay: 1s
      - lambda: id(dial_touched) = false;
      - sensor.rotary_encoder.set_value:
          id: dial
          value: 0
      - script.execute: control_leds

  # A step of the dial with the center button held while music plays: the
  # Sendspin group's volume.
  - id: control_group_volume
    mode: restart
    parameters:
      increase_volume: bool
    then:
      - lambda: id(dial_group) = true;
      - delay: 16ms
      - if:
          condition:
            lambda: return increase_volume;
          then:
            - media_player.volume_up: sendspin_group_media_player
          else:
            - media_player.volume_down: sendspin_group_media_player
      - script.execute: control_leds
      - delay: 1s
      - lambda: id(dial_touched) = false;
      - sensor.rotary_encoder.set_value:
          id: dial
          value: 0
      - script.execute: control_leds

  # The app's speech (calls, announcements, the intercom) at the media
  # player's volume: the same range, and silent when it is muted or at zero.
  - id: sync_call_volume
    then:
      - lambda: |-
          const float volume = id(external_media_player).volume;
          const bool silent = id(external_media_player).is_muted() || volume < 0.001f;
          id(call_speaker).set_volume(silent ? 0.0f : remap<float, float>(volume, 0.0f, 1.0f, ${volume_min}, ${volume_max}));

  # What the ring shows, as the stock firmware does first: Wi-Fi being given
  # over Bluetooth, a warm white sparkle; starting up, a
  # blue sparkle once on Wi-Fi (solid warm white before); after, a red
  # sparkle while Wi-Fi or the app is lost. Else, for a moment, the jack
  # going in or out; else the volume while the dial turns; else a call's own
  # (its events drive it during one); else between calls the intercom, else
  # someone listening live, else another satellite's announcement, else a
  # ringing timer, else the time left on the timer that finishes soonest,
  # else muted, else the LED Ring light, if it is on.
  - id: control_leds
    mode: restart
    then:
      - if:
          condition:
            lambda: return id(improv_ble_in_progress);
          then:
            - light.turn_on:
                id: voice_assistant_leds
                brightness: !lambda ${ring_brightness}
                red: 100%
                green: 89%
                blue: 71%
                effect: "Twinkle"
          else:
            - if:
                condition:
                  lambda: return id(init_in_progress);
                then:
                  - if:
                      condition:
                        wifi.connected:
                      then:
                        - light.turn_on:
                            id: voice_assistant_leds
                            brightness: !lambda ${ring_brightness}
                            red: 9.4%
                            green: 73.3%
                            blue: 94.9%
                            effect: "Twinkle"
                      else:
                        - light.turn_on:
                            id: voice_assistant_leds
                            brightness: !lambda ${ring_brightness}
                            red: 100%
                            green: 89%
                            blue: 71%
                            effect: "none"
                else:
                  - if:
                      condition:
                        lambda: return !id(wifi_id).is_connected() || !id(vc).is_connected();
                      then:
                        - light.turn_on:
                            id: voice_assistant_leds
                            brightness: !lambda ${ring_brightness}
                            red: 100%
                            green: 0%
                            blue: 0%
                            effect: "Twinkle"
                      else:
                        - if:
                            condition:
                              lambda: return id(jack_plugged_recently) || id(jack_unplugged_recently);
                            then:
                              - light.turn_on:
                                  id: voice_assistant_leds
                                  brightness: !lambda ${ring_brightness}
                                  effect: !lambda 'return id(jack_plugged_recently) ? "Jack Plugged" : "Jack Unplugged";'
                            else:
                              - if:
                                  condition:
                                    lambda: return id(dial_touched);
                                  then:
                                    - light.turn_on:
                                        id: voice_assistant_leds
                                        brightness: !lambda ${ring_brightness}
                                        effect: "Volume Display"
                                  else:
                                    - if:
                                        condition:
                                          lambda: return id(call_active) || id(showing_result);
                                        then:
                                          - light.turn_on:
                                              id: voice_assistant_leds
                                              brightness: !lambda ${ring_brightness}
                                              effect: !lambda 'return id(showing_result) ? "Result" : id(call_effect);'
                                        else:
                                          - if:
                                              condition:
                                                lambda: return id(vc).is_monitoring();
                                              then:
                                                - light.turn_on:
                                                    id: voice_assistant_leds
                                                    brightness: !lambda ${ring_brightness}
                                                    effect: !lambda 'return id(vc).is_intercom() ? "Intercom" : "Recording";'
                                              else:
                                                - if:
                                                    condition:
                                                      lambda: return id(app_announcing);
                                                    then:
                                                      - light.turn_on:
                                                          id: voice_assistant_leds
                                                          brightness: !lambda ${ring_brightness}
                                                          effect: "Replying"
                                                    else:
                                                      - if:
                                                          condition:
                                                            lambda: return id(timer_ringing);
                                                          then:
                                                            - light.turn_on:
                                                                id: voice_assistant_leds
                                                                brightness: !lambda ${ring_brightness}
                                                                effect: "Timer Ring"
                                                          else:
                                                            - if:
                                                                condition:
                                                                  lambda: return id(timer_shown);
                                                                then:
                                                                  # Two timers or more: bright enough by day to tell their colors apart.
                                                                  - light.turn_on:
                                                                      id: voice_assistant_leds
                                                                      brightness: !lambda 'return id(night) ? 0.2f : std::max(id(led_ring).current_values.get_brightness(), id(timer_count) > 1 ? 0.5f : 0.2f);'
                                                                      effect: "Timer Tick"
                                                                else:
                                                                  - if:
                                                                      condition:
                                                                        switch.is_on: master_mute_switch
                                                                      then:
                                                                        - light.turn_on:
                                                                            id: voice_assistant_leds
                                                                            brightness: !lambda ${ring_brightness}
                                                                            effect: "Muted"
                                                                      else:
                                                                        - light.turn_off: voice_assistant_leds
                                                                        # Dark at night, the LED Ring light aside.
                                                                        - if:
                                                                            condition:
                                                                              and:
                                                                                - light.is_on: led_ring
                                                                                - lambda: return !id(night);
                                                                            then:
                                                                              - light.turn_on: led_ring

  # At night, how a command went, on the ring for a moment: during the call
  # and after it, then dark again ("Result").
  - id: show_result
    mode: restart
    then:
      - lambda: |-
          id(showing_result) = true;
          id(result_started_ms) = millis();
      - script.execute: control_leds
      - delay: !lambda 'return id(result_ok) ? 1000 : 600;'
      - lambda: id(showing_result) = false;
      - script.execute: control_leds

  # One of this satellite's own sounds (an audio_file id), as the stock firmware
  # plays them: an announcement, the music turned down meanwhile -- unless
  # something is already being announced, which it would cut off. Not at night.
  - id: play_sound
    mode: restart
    parameters:
      sound_file: string
    then:
      - if:
          condition:
            and:
              - not:
                  media_player.is_announcing: external_media_player
              - lambda: return !id(night);
          then:
            - lambda: |-
                id(playing_sound) = true;
                id(external_media_player)
                  ->make_call()
                  .set_media_url("audio-file://" + sound_file)
                  .set_announcement(true)
                  .perform();
            # One that never started leaves nothing for on_state to clear, and
            # the next announcement would go untold.
            - wait_until:
                condition:
                  media_player.is_announcing: external_media_player
                timeout: 1s
            - if:
                condition:
                  not:
                    media_player.is_announcing: external_media_player
                then:
                  - lambda: id(playing_sound) = false;
                  - script.execute: duck_music

  # "Stop", said alone, is listened for while a response is said and while a
  # timer rings, as the stock firmware does: in a call it ends the call
  # (on_stop_word); outside one, the app takes it as stopping the timer.
  - id: listen_for_stop
    then:
      - if:
          condition:
            lambda: return id(responding) || id(timer_ringing);
          then:
            - voice_incubator.enable_stop_word:
          else:
            - voice_incubator.disable_stop_word:

  # Music down while a call is open, a timer rings, something is announced or
  # the intercom is on; back up when none is.
  - id: duck_music
    mode: restart
    then:
      - if:
          condition:
            lambda: return id(call_active) || id(timer_ringing) || id(announcing) || id(playing_sound) || id(app_announcing) || id(vc).is_intercom();
          then:
            - mixer_speaker.apply_ducking:
                id: media_mixing_input
                decibel_reduction: 20
                duration: 0s
          else:
            - mixer_speaker.apply_ducking:
                id: media_mixing_input
                decibel_reduction: 0
                duration: 1s

voice_incubator:
  id: vc
  model: voice-pe
  microphone:
    microphone: i2s_mics
    channels: 0
  # The wake word models run on the echo-cancelled channel, which detects better
  # than the stock NS tap once the talker is at a sane level (18/20 vs 14/20 on
  # the same batch). This source is what starts and stops the microphone.
  wake_microphone:
    microphone: i2s_mics
    channels: 1
    gain_factor: 4
  # The same channel, recorded alongside the call and used to identify the
  # speaker. The XMOS AEC tap sits ~40 dB below full scale, so at unity gain its
  # top 16 bits hold only ~7 bits of speech and speaker ID degrades (EER 0.8% ->
  # 2.4%, simulated on recorded VPE audio). Gain is applied before the 16-bit
  # truncation, so it restores real resolution: 4 recovers most of it, 16
  # matches a 32-bit capture exactly and leaves ~25 dB of headroom.
  aec_microphone:
    microphone: i2s_mics
    channels: 1
    gain_factor: 16
  speaker: call_speaker
  port: 6055
  preroll: 1.5s
  output_buffer: 1s
  call_timeout: 30s
  # The onboard amp distorts above roughly 85%.
  volume: 70%
  on_call_start:
    - lambda: id(call_active) = true;
    - script.execute: duck_music
    # Whatever was being announced stops for the new call.
    - if:
        condition:
          media_player.is_announcing: external_media_player
        then:
          - media_player.stop:
              id: external_media_player
              announcement: true
    # Detection keeps running: the call's mic source is passive, so stopping the
    # wake word source would stop the microphone mid-call. A detection during a
    # call is harmless, since start_call is a no-op while one is active.
    - logger.log:
        format: "Call started: %s"
        args: [wake_word.c_str()]
    # An answer the app asked for (follow_up) spins slowly, as the stock
    # firmware waits for a command. A wake word stands still, fading in, until
    # the app has verified it (listening), and then spins fast: a refused one
    # never moves.
    - lambda: |-
        id(speaker_rgb) = -1;
        id(showing_result) = false;
        id(call_effect) = wake_word == "follow_up" ? "Waiting for Command" : "Heard";
    - light.turn_on:
        id: voice_assistant_leds
        brightness: !lambda ${ring_brightness}
        effect: !lambda return id(call_effect);
  on_call_end:
    - lambda: |-
        id(call_active) = false;
        id(responding) = false;
    - script.execute: listen_for_stop
    - script.execute: duck_music
    - logger.log:
        format: "Call ended: %s"
        args: [reason.c_str()]
    - lambda: id(speaker_rgb) = -1;
    # Another satellite heard the wake word better and answers it: a short dim
    # flash, so it is seen that this one heard it too.
    - if:
        condition:
          lambda: return reason == "answered_elsewhere";
        then:
          - light.turn_on:
              id: voice_assistant_leds
              brightness: !lambda 'return id(night) ? 0.2f : 0.25f;'
              effect: "Answered Elsewhere"
          - delay: 400ms
    - script.execute: control_leds
  on_event:
    - logger.log:
        format: "Event %s: stage=%s speaker=%s"
        args: [event_type.c_str(), 'event_data.get("stage").c_str()', 'event_data.get("speaker").c_str()']
    # processing / enrolling / speaker_enrolled carry the speaker's color as r, g,
    # b. The effects read it every frame, so a color change shows immediately.
    - lambda: |-
        if (event_data.has("r")) {
          id(speaker_rgb) = (event_data.get_int("r") & 0xFF) << 16 |
                            (event_data.get_int("g") & 0xFF) << 8 |
                            (event_data.get_int("b") & 0xFF);
        } else if (event_type == "processing") {
          id(speaker_rgb) = -1;  // nobody recognized: default color
        }
    # Night mode on or off in the satellite's area.
    - if:
        condition:
          lambda: 'return event_type == "night";'
        then:
          - lambda: id(night) = event_data.get_bool("on");
          - script.execute: control_leds
    # At night, how a command went, instead of anything said.
    - if:
        condition:
          lambda: 'return event_type == "result";'
        then:
          - lambda: id(result_ok) = event_data.get_bool("ok");
          - script.execute: show_result
    # A ringing timer keeps the music down until it is stopped, and flashes
    # the ring.
    - if:
        condition:
          lambda: 'return event_type == "timer_ringing" || event_type == "timer_stopped";'
        then:
          - lambda: id(timer_ringing) = event_type == "timer_ringing";
          - script.execute: listen_for_stop
          - script.execute: duck_music
          - script.execute: control_leds
    # Someone started or stopped listening live: the component's own event,
    # sent exactly when it starts and stops streaming the microphone.
    - if:
        condition:
          lambda: 'return event_type == "monitoring";'
        then:
          - script.execute: duck_music
          - script.execute: control_leds
    # Another satellite's announcement: the music down, the ring spinning
    # while it is said.
    - if:
        condition:
          lambda: 'return event_type == "announcement";'
        then:
          - lambda: id(app_announcing) = event_data.get_bool("active");
          - script.execute: duck_music
          - if:
              condition:
                lambda: return id(app_announcing);
              then:
                - light.turn_on:
                    id: voice_assistant_leds
                    brightness: !lambda ${ring_brightness}
                    effect: "Replying"
              else:
                - script.execute: control_leds
    # The timer that finishes soonest (shown: 0 when none is running).
    - if:
        condition:
          lambda: 'return event_type == "timer_progress";'
        then:
          - lambda: |-
              id(timer_shown) = event_data.get_int("shown") != 0;
              id(timer_left_s) = event_data.get_float("remaining");
              id(timer_total_s) = event_data.get_float("total", 1.0f);
              id(timer_paused) = event_data.get_int("paused") != 0;
              id(timer_received_ms) = millis();
              id(timer_count) = std::min(event_data.get_int("count", event_data.get_int("shown")), 6);
              id(timer_scale_s) = event_data.get_float("scale", id(timer_total_s));
              for (int k = 0; k < id(timer_count); k++) {
                id(timer_lefts)[k] = event_data.get_float("left" + std::to_string(k), id(timer_left_s));
                id(timer_colors)[k] = event_data.get_int("color" + std::to_string(k), -1);
              }
          - script.execute: control_leds
    # The app verified the wake word: the ring starts spinning where it stood.
    # (An answer's listening changes nothing: it spins slowly from the start.)
    - if:
        condition:
          lambda: 'return event_type == "listening" && id(call_effect) == "Heard";'
        then:
          - lambda: id(call_effect) = "Listening For Command";
          - light.turn_on:
              id: voice_assistant_leds
              brightness: !lambda ${ring_brightness}
              effect: "Listening For Command"
    - if:
        condition:
          lambda: 'return event_type == "processing";'
        then:
          - lambda: id(call_effect) = "Thinking";
          - light.turn_on:
              id: voice_assistant_leds
              brightness: !lambda ${ring_brightness}
              effect: "Thinking"
    - if:
        condition:
          lambda: 'return event_type == "responding" || event_type == "enrolling" || event_type == "speaker_enrolled";'
        then:
          - lambda: id(call_effect) = "Replying";
          - light.turn_on:
              id: voice_assistant_leds
              brightness: !lambda ${ring_brightness}
              effect: "Replying"
    # The response: "stop" may end it from here on. The model waits out its
    # first second, as the stock firmware's stop word starts a second in.
    - if:
        condition:
          lambda: 'return event_type == "responding";'
        then:
          - lambda: id(responding) = true;
          - script.execute: listen_for_stop
  # "Stop" said over the response: as the center button, the call ends and
  # what it is saying is cut off.
  on_stop_word:
    - voice_incubator.cancel:
    - if:
        condition:
          media_player.is_announcing: external_media_player
        then:
          - media_player.stop:
              id: external_media_player
              announcement: true
  # The app asked something back -- an LLM's question, a command's
  # confirmation -- and its reply and the sound saying it is the speaker's
  # turn have played out: the microphone opens again for the answer, with no
  # wake word and nothing from before it. Not while muted.
  on_listen:
    - if:
        condition:
          switch.is_off: master_mute_switch
        then:
          - voice_incubator.start:
              wake_word: follow_up
              preroll: 0ms
  on_connected:
    # Detection starts on its own once the app finishes pushing a model.
    - logger.log: "Home Assistant connected"
    - lambda: id(init_in_progress) = false;
    - script.execute: control_leds
  on_disconnected:
    - logger.log: "Home Assistant disconnected"
    - script.execute: control_leds
  on_model_loaded:
    - logger.log:
        format: "Wake word model loaded: %s"
        args: [model_id.c_str()]

# ---------------------------------------------------------------- LED ring
#
# Wiring and effects from the stock VPE firmware (home-assistant-voice.yaml):
# the effects take their color and brightness from the user-facing LED Ring
# light (led_ring), as there -- except during a call, where a recognized
# speaker's color (speaker_rgb, from the app's events) takes its place.

power_supply:
  - id: led_power
    pin: GPIO45

light:
  - platform: esp32_rmt_led_strip
    id: leds_internal
    internal: true
    pin: GPIO21
    chipset: WS2812
    max_refresh_rate: 15ms
    num_leds: 12
    channel_colors: GRB
    rmt_symbols: 192
    default_transition_length: 0ms
    power_supply: led_power

  # The ring remapped so LED 0 is at the top, as in the stock firmware.
  - platform: partition
    id: voice_assistant_leds
    internal: true
    default_transition_length: 0ms
    segments:
      - id: leds_internal
        from: 7
        to: 11
      - id: leds_internal
        from: 0
        to: 6
    effects:
      # Starting up, or Wi-Fi or the app lost: as the stock firmware, in the
      # color it is turned on with.
      - addressable_twinkle:
          name: "Twinkle"
          twinkle_probability: 50%
      # Slow clockwise spin: the app asked something back, and the
      # microphone is open for the answer (the stock firmware's "Waiting for
      # Command").
      - addressable_lambda:
          name: "Waiting for Command"
          update_interval: 100ms
          lambda: |-
            const int rgb = id(speaker_rgb) >= 0 && !id(night) ? id(speaker_rgb) : ${ring_rgb};
            Color color((rgb >> 16) & 0xFF, (rgb >> 8) & 0xFF, rgb & 0xFF);
            for (uint8_t i = 0; i < 12; i++) {
              if (i == id(global_led_animation_index) % 12) {
                it[i] = color;
              } else if (i == (id(global_led_animation_index) + 11) % 12) {
                it[i] = color * 192;
              } else if (i == (id(global_led_animation_index) + 10) % 12) {
                it[i] = color * 128;
              } else if (i == (id(global_led_animation_index) + 6) % 12) {
                it[i] = color;
              } else if (i == (id(global_led_animation_index) + 5) % 12) {
                it[i] = color * 192;
              } else if (i == (id(global_led_animation_index) + 4) % 12) {
                it[i] = color * 128;
              } else {
                it[i] = Color::BLACK;
              }
            }
            id(global_led_animation_index) = (id(global_led_animation_index) + 1) % 12;
      # Standing still: a wake word heard and not yet verified by the app. The
      # fast spin's own frame, fading in slowly at first (the square of the
      # time, full at 400 ms): one the app refuses, most of them within 0.2 s,
      # is a faint glow that never moves; one it verifies starts spinning
      # from here (the listening event).
      #
      # The glow is the ring's color from its first frame. The gamma
      # correction keeps any channel with a value at 1 at least, so a dim
      # blue would come out white or teal (every channel at 1). While it
      # fades, each LED is lit at the level its strongest channel would get,
      # in the proportions of the ring's color at full.
      - addressable_lambda:
          name: "Heard"
          update_interval: 20ms
          lambda: |-
            static uint32_t started = 0;
            static esphome::light::ESPColorCorrection lit, raw;
            if (initial_run) {
              started = millis();
            }
            const float t = std::min(1.0f, (millis() - started) / 400.0f);
            const int rgb = id(speaker_rgb) >= 0 && !id(night) ? id(speaker_rgb) : ${ring_rgb};
            const Color full((rgb >> 16) & 0xFF, (rgb >> 8) & 0xFF, rgb & 0xFF);
            const Color color = full * uint8_t(255.0f * t * t);
            // The ring's own correction: the levels the LEDs would get.
            lit.set_gamma_table(id(voice_assistant_leds).get_gamma_table());
            lit.set_local_brightness(uint8_t(roundf(id(voice_assistant_leds).current_values.get_brightness() * 255.0f)));
            const Color target = lit.color_correct(full);
            const uint16_t top = std::max({target.r, target.g, target.b});
            auto show = [&](uint8_t i, const Color &c) {
              if (t >= 1.0f || top == 0) {
                it[i] = c;
                return;
              }
              const Color now = lit.color_correct(c);
              const uint16_t level = std::max({now.r, now.g, now.b});
              auto part = [&](uint8_t v) { return uint8_t((v * level * 2 + top) / (2 * top)); };
              auto led = it[i];
              led.raw_set_color_correction(&raw);
              led = Color(part(target.r), part(target.g), part(target.b));
            };
            const uint8_t head = id(global_led_animation_index) % 12;
            for (uint8_t i = 0; i < 12; i++) {
              if (i == head || i == (head + 6) % 12) {
                show(i, color);
              } else if (i == (head + 11) % 12 || i == (head + 5) % 12) {
                show(i, color * 192);
              } else if (i == (head + 10) % 12 || i == (head + 4) % 12) {
                show(i, color * 128);
              } else {
                it[i] = Color::BLACK;
              }
            }
      # Fast clockwise spin: wake word heard, command being spoken.
      - addressable_lambda:
          name: "Listening For Command"
          update_interval: 50ms
          lambda: |-
            const int rgb = id(speaker_rgb) >= 0 && !id(night) ? id(speaker_rgb) : ${ring_rgb};
            Color color((rgb >> 16) & 0xFF, (rgb >> 8) & 0xFF, rgb & 0xFF);
            for (uint8_t i = 0; i < 12; i++) {
              if (i == id(global_led_animation_index) % 12) {
                it[i] = color;
              } else if (i == (id(global_led_animation_index) + 11) % 12) {
                it[i] = color * 192;
              } else if (i == (id(global_led_animation_index) + 10) % 12) {
                it[i] = color * 128;
              } else if (i == (id(global_led_animation_index) + 6) % 12) {
                it[i] = color;
              } else if (i == (id(global_led_animation_index) + 5) % 12) {
                it[i] = color * 192;
              } else if (i == (id(global_led_animation_index) + 4) % 12) {
                it[i] = color * 128;
              } else {
                it[i] = Color::BLACK;
              }
            }
            id(global_led_animation_index) = (id(global_led_animation_index) + 1) % 12;
      # The spin stops and two LEDs pulse: the command is being processed. This
      # is where the speaker's color first shows.
      - addressable_lambda:
          name: "Thinking"
          update_interval: 10ms
          lambda: |-
            static uint8_t brightness_step = 0;
            static bool brightness_decreasing = true;
            static uint8_t brightness_step_number = 10;
            if (initial_run) {
              brightness_step = 0;
              brightness_decreasing = true;
            }
            const int rgb = id(speaker_rgb) >= 0 && !id(night) ? id(speaker_rgb) : ${ring_rgb};
            Color color((rgb >> 16) & 0xFF, (rgb >> 8) & 0xFF, rgb & 0xFF);
            for (uint8_t i = 0; i < 12; i++) {
              if (i == id(global_led_animation_index) % 12) {
                it[i] = color * uint8_t(255/brightness_step_number*(brightness_step_number-brightness_step));
              } else if (i == (id(global_led_animation_index) + 6) % 12) {
                it[i] = color * uint8_t(255/brightness_step_number*(brightness_step_number-brightness_step));
              } else {
                it[i] = Color::BLACK;
              }
            }
            if (brightness_decreasing) {
              brightness_step++;
            } else {
              brightness_step--;
            }
            if (brightness_step == 0 || brightness_step == brightness_step_number) {
              brightness_decreasing = !brightness_decreasing;
            }
      # Pulsing: a timer is ringing (the stock firmware's "Timer Ring"), with
      # the two red LEDs while muted.
      - addressable_lambda:
          name: "Timer Ring"
          update_interval: 10ms
          lambda: |-
            static uint8_t brightness_step = 0;
            static bool brightness_decreasing = true;
            static uint8_t brightness_step_number = 10;
            if (initial_run) {
              brightness_step = 0;
              brightness_decreasing = true;
            }
            const int rgb = ${ring_rgb};
            Color color((rgb >> 16) & 0xFF, (rgb >> 8) & 0xFF, rgb & 0xFF);
            for (uint8_t i = 0; i < 12; i++) {
              it[i] = color * uint8_t(255 / brightness_step_number * (brightness_step_number - brightness_step));
            }
            if (id(master_mute_switch).state) {
              it[3] = Color(255, 0, 0);
              it[9] = Color(255, 0, 0);
            }
            if (brightness_decreasing) {
              brightness_step++;
            } else {
              brightness_step--;
            }
            if (brightness_step == 0 || brightness_step == brightness_step_number) {
              brightness_decreasing = !brightness_decreasing;
            }
      # The time left as a share of the ring, clockwise from the top, the last
      # The running timers, each in its color as far as it runs (the stock
      # firmware's "Timer Tick", layered): the whole ring is the longest one's
      # length, and the sooner ones lie on top, each an LED past the one
      # before at least. Each LED is one timer's: an end within an LED takes
      # it from the next half on; only the last fades out as it runs down.
      # Amber only at night. A dimmer LED steps round once a second through
      # the soonest. Muted, the two red LEDs show over it.
      - addressable_lambda:
          name: "Timer Tick"
          update_interval: 100ms
          lambda: |-
            static uint32_t last_step = 0;
            const uint32_t now = millis();
            float elapsed = 0.0f;
            if (!id(timer_paused)) {
              elapsed = (now - id(timer_received_ms)) / 1000.0f;
              if (now - last_step >= 1000) {
                last_step = now;
                id(global_led_animation_index) = (id(global_led_animation_index) + 1) % 12;
              }
            }
            const int n = id(timer_count);
            const float scale = std::max(id(timer_scale_s), 1.0f);
            float ends[6];
            float before = 0.0f;
            for (int k = 0; k < n; k++) {
              const float left = std::max(id(timer_lefts)[k] - elapsed, 0.0f);
              ends[k] = std::min(std::max(12.0f * left / scale, before + 1.0f), 12.0f);
              before = ends[k];
            }
            for (int i = 0; i < 12; i++) {
              it[i] = Color::BLACK;
            }
            for (int k = n - 1; k >= 0; k--) {
              const int rgb = id(night) || id(timer_colors)[k] < 0 ? ${ring_rgb} : id(timer_colors)[k];
              const Color color((rgb >> 16) & 0xFF, (rgb >> 8) & 0xFF, rgb & 0xFF);
              for (int i = 0; i < 12 && i < ends[k]; i++) {
                const float f = std::min(ends[k] - i, 1.0f);
                if (k == n - 1) {
                  it[i] = color * uint8_t(255.0f * f);
                } else if (f >= 0.5f) {
                  it[i] = color;
                }
              }
            }
            const int step = id(global_led_animation_index) % 12;
            if (n > 0 && !id(timer_paused) && step + 1 < ends[0]) {
              it[step] = it[step].get() * uint8_t(230);
            }
            if (id(master_mute_switch).state) {
              it[2] = Color::BLACK;
              it[4] = Color::BLACK;
              it[8] = Color::BLACK;
              it[10] = Color::BLACK;
              it[3] = Color(255, 0, 0);
              it[9] = Color(255, 0, 0);
            }
      # The volume, while the dial turns: as much of the ring as it is, from
      # the bottom clockwise; the bottom LED red when silent.
      - addressable_lambda:
          name: "Volume Display"
          update_interval: 50ms
          lambda: |-
            const int rgb = ${ring_rgb};
            const Color color((rgb >> 16) & 0xFF, (rgb >> 8) & 0xFF, rgb & 0xFF);
            const bool group = id(dial_group);
            const float volume = group ? id(sendspin_group_media_player).volume : id(external_media_player).volume;
            const float ratio = 12.0f * volume;
            for (uint8_t i = 0; i < 12; i++) {
              it[(6 + i) % 12] = i <= ratio ? color * (uint8_t) std::min(255.0f * (ratio - i), 255.0f) : Color::BLACK;
            }
            if (volume < 0.001f || (!group && id(external_media_player).is_muted())) {
              it[6] = Color(255, 0, 0);
            }
      # The whole ring blinks in its own color: the intercom joins this
      # satellite and another, until the button on either is pressed.
      - addressable_lambda:
          name: "Intercom"
          update_interval: 50ms
          lambda: |-
            const int rgb = ${ring_rgb};
            const Color on((rgb >> 16) & 0xFF, (rgb >> 8) & 0xFF, rgb & 0xFF);
            const Color color = millis() % 1000 < 500 ? on : Color::BLACK;
            for (uint8_t i = 0; i < 12; i++) {
              it[i] = color;
            }
      # The whole ring, dimly, for a moment: another satellite heard the wake
      # word better and answers it.
      - addressable_lambda:
          name: "Answered Elsewhere"
          update_interval: 50ms
          lambda: |-
            const int rgb = ${ring_rgb};
            const Color color((rgb >> 16) & 0xFF, (rgb >> 8) & 0xFF, rgb & 0xFF);
            for (uint8_t i = 0; i < 12; i++) {
              it[i] = color;
            }
      # At night, how a command went (show_result): one slow green pulse when
      # it was done, two quick red blinks when it wasn't.
      - addressable_lambda:
          name: "Result"
          update_interval: 20ms
          lambda: |-
            const uint32_t t = millis() - id(result_started_ms);
            float level;
            if (id(result_ok)) {
              level = t < 400 ? t / 400.0f : t < 1000 ? 1.0f - (t - 400) / 600.0f : 0.0f;
            } else {
              level = t < 150 || (t >= 300 && t < 450) ? 1.0f : 0.0f;
            }
            const Color color = id(result_ok) ? Color(0, 255, 64) : Color(255, 0, 0);
            it.all() = color * uint8_t(level * 255);
      # The whole ring blinks red: the microphone is streamed to someone
      # listening live (outside a call).
      - addressable_lambda:
          name: "Recording"
          update_interval: 50ms
          lambda: |-
            const Color color = millis() % 1000 < 500 ? Color(255, 0, 0) : Color::BLACK;
            for (uint8_t i = 0; i < 12; i++) {
              it[i] = color;
            }
      # Muted: two red LEDs, left and right, over the LED Ring light if it is
      # on (the stock firmware's "Muted or Silent").
      - addressable_lambda:
          name: "Muted"
          update_interval: 100ms
          lambda: |-
            const int rgb = ${ring_rgb};
            const Color color = id(led_ring).current_values.is_on() && !id(night)
                ? Color((rgb >> 16) & 0xFF, (rgb >> 8) & 0xFF, rgb & 0xFF) : Color::BLACK;
            for (uint8_t i = 0; i < 12; i++) {
              it[i] = color;
            }
            it[2] = Color::BLACK;
            it[4] = Color::BLACK;
            it[8] = Color::BLACK;
            it[10] = Color::BLACK;
            it[3] = Color(255, 0, 0);
            it[9] = Color(255, 0, 0);
      # The jack going in: two LEDs sweep from the top down to the bottom;
      # coming out, back up (as the stock firmware).
      - addressable_lambda:
          name: "Jack Plugged"
          update_interval: 40ms
          lambda: |-
            static uint8_t index = 0;
            if (initial_run) {
              index = 0;
            }
            const int rgb = ${ring_rgb};
            const Color color((rgb >> 16) & 0xFF, (rgb >> 8) & 0xFF, rgb & 0xFF);
            if (index <= 6) {
              for (uint8_t i = 0; i < 12; i++) {
                it[i] = (i == index || i == (12 - index) % 12) ? color : Color::BLACK;
              }
            }
            index++;
      - addressable_lambda:
          name: "Jack Unplugged"
          update_interval: 40ms
          lambda: |-
            static uint8_t index = 0;
            if (initial_run) {
              index = 0;
            }
            const int rgb = ${ring_rgb};
            const Color color((rgb >> 16) & 0xFF, (rgb >> 8) & 0xFF, rgb & 0xFF);
            if (index <= 6) {
              for (uint8_t i = 0; i < 12; i++) {
                it[i] = (i == 6 - index || i == (6 + index) % 12) ? color : Color::BLACK;
              }
            }
            index++;
      # Anticlockwise spin: the response is playing.
      - addressable_lambda:
          name: "Replying"
          update_interval: 50ms
          lambda: |-
            id(global_led_animation_index) = (12 + id(global_led_animation_index) - 1) % 12;
            const int rgb = id(speaker_rgb) >= 0 && !id(night) ? id(speaker_rgb) : ${ring_rgb};
            Color color((rgb >> 16) & 0xFF, (rgb >> 8) & 0xFF, rgb & 0xFF);
            for (uint8_t i = 0; i < 12; i++) {
              if (i == (id(global_led_animation_index)) % 12) {
                it[i] = color;
              } else if (i == ( id(global_led_animation_index) + 1) % 12) {
                it[i] = color * 192;
              } else if (i == ( id(global_led_animation_index) + 2) % 12) {
                it[i] = color * 128;
              } else if (i == ( id(global_led_animation_index) + 6) % 12) {
                it[i] = color;
              } else if (i == ( id(global_led_animation_index) + 7) % 12) {
                it[i] = color * 192;
              } else if (i == ( id(global_led_animation_index) + 8) % 12) {
                it[i] = color * 128;
              } else {
                it[i] = Color::BLACK;
              }
            }

  # The LED Ring light Home Assistant sees, as in the stock firmware: on, it
  # shows when nothing else is; its color and brightness are the ring's.
  - platform: partition
    id: led_ring
    name: LED Ring
    entity_category: config
    icon: "mdi:circle-outline"
    default_transition_length: 0ms
    restore_mode: RESTORE_DEFAULT_OFF
    initial_state:
      color_mode: rgb
      brightness: 66%
      red: 9.4%
      green: 73.3%
      blue: 94.9%
    segments:
      - id: leds_internal
        from: 7
        to: 11
      - id: leds_internal
        from: 0
        to: 6
